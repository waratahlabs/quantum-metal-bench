[project]
name = "quantum-metal-bench"
version = "0.1.0"
description = "Cross-platform quantum statevector simulation benchmark: Apple Silicon Metal vs NVIDIA CUDA/cuQuantum vs CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pennylane>=0.44",
    "numpy>=2.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
cuda = ["pennylane-lightning-gpu"]
dev = ["pytest>=8.0"]

[project.scripts]
qmb = "quantum_metal_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_metal_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
